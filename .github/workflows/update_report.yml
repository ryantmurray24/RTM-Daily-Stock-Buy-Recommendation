name: Update Market Report

on:
  schedule:
    # 9:30 AM ET = 13:30 UTC (EDT, Mar–Nov)
    - cron: '30 13 * * 1-5'
    # 4:00 PM ET = 20:00 UTC (EDT, Mar–Nov)
    - cron: '0 20 * * 1-5'
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        run: python generate_report.py

      - name: Commit and push updated report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html latest_data.json
          git diff --staged --quiet || git commit -m "Auto-update: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M ET')"
          git push
